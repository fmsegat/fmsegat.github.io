<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Seleção de Contratilidade Segmentar</title>

<style>
:root {
    --bg: #eef2f7;
    --card: rgba(255, 255, 255, 0.9);
    --border: #dbe4ef;
    --text: #1f2d3d;
    --muted: #64748b;
    --shadow: 0 16px 38px rgba(15, 23, 42, 0.10);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 14px 18px 24px;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0) 24%),
        linear-gradient(180deg, #f6f8fb 0%, #edf2f7 100%);
    color: var(--text);
}

.page {
    max-width: 1220px;
    margin: 0 auto;
}

.page-header {
    text-align: center;
    margin-bottom: 14px;
}

.page-header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
}

.page-header p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 14px;
}

.toolbar {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 18px 0 22px;
}

button {
    margin: 0;
    padding: 10px 16px;
    border: 1px solid #d4dde9;
    border-radius: 999px;
    background: #fff;
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
}

button:hover {
    background: #f8fbff;
    border-color: #c0cfdf;
    transform: translateY(-1px);
}

.container {
    display: grid;
    gap: 18px;
}

.panel {
    display: grid;
    grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr);
    gap: 18px;
    align-items: start;
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
}

.map-card {
    padding: 12px 16px 14px;
}

.map-card h2,
.sidebar-card h3 {
    margin: 0 0 10px;
    font-size: 17px;
    font-weight: 700;
}

.map-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
}

.map-subtitle {
    margin: 0 0 6px;
    font-size: 14px;
    color: var(--muted);
}

.diagram-wrap {
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(248,250,252,0.9));
}

.ventricular-svg {
    width: 100%;
    height: auto;
    display: block;
}

.sidebar {
    display: grid;
    gap: 16px;
}

.sidebar-card {
    padding: 14px 16px 16px;
}

.legend-list,
.selection-list {
    margin: 0;
    padding-left: 20px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 0;
    color: #334155;
}

.legend-swatch {
    width: 15px;
    height: 15px;
    border-radius: 999px;
    border: 1px solid rgba(15, 23, 42, 0.15);
    flex: 0 0 auto;
}

.selection-list li,
.laudo {
    color: #375377;
    font-size: 15px;
    line-height: 1.45;
}

.selection-list li + li {
    margin-top: 6px;
}

.empty {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
}

.actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.segment {
    stroke: #5f646a;
    stroke-width: 1.6;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.15s ease;
}

.segment:hover {
    filter: brightness(1.03);
}

.segment.disabled {
    cursor: not-allowed;
    opacity: 0.55;
}

.guide-path {
    fill: none;
    stroke: #68707a;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.88;
    pointer-events: none;
}

.segment-number {
    pointer-events: none;
    fill: #17212b;
    font-size: 10px;
    font-weight: 700;
}

.label-chip {
    cursor: pointer;
}

.label-chip circle {
    fill: rgba(255, 255, 255, 0.9);
    stroke: #66758b;
    stroke-width: 1;
}

.label-chip text {
    pointer-events: none;
    fill: #17212b;
    font-size: 10px;
    font-weight: 700;
    dominant-baseline: middle;
    text-anchor: middle;
}

.views-title {
    font-size: 12px;
    font-weight: 700;
    fill: #4b5563;
}

.state-menu {
    position: fixed;
    z-index: 1000;
    min-width: 225px;
    padding: 10px;
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 14px;
    box-shadow: 0 18px 44px rgba(15, 23, 42, 0.18);
}

.state-menu.hidden {
    display: none;
}

.state-menu-title {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 700;
    color: #334155;
}

.state-option {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: flex-start;
    border-radius: 10px;
    padding: 9px 10px;
    border: 1px solid transparent;
    background: transparent;
    transform: none;
    box-shadow: none;
}

.state-option:hover {
    background: #f8fafc;
    border-color: #e2e8f0;
    transform: none;
}

.state-option.active {
    background: #eff6ff;
    border-color: #bfdbfe;
}

.state-swatch {
    width: 14px;
    height: 14px;
    border-radius: 999px;
    border: 1px solid rgba(15, 23, 42, 0.18);
    flex: 0 0 auto;
}

@media (max-width: 980px) {
    .panel {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

    <div class="page-header">

</div>

    d: "m 403,1030.3254 v -4.3413 l 1.23378,-0.3916 c 1.79001,-0.5682 2.22555,0.2476 2.62022,4.9075 l 0.3529,4.1667 H 405.10345 403 Z m 7,3.3413 c 0,-0.55 -0.43229,-1 -0.96066,-1 -1.77525,0 -1.76748,-1.2691 0.0243,-3.9767 l 1.78017,-2.69 h 1.24474 1.24474 v 1.2403 c 0,0.6821 0.19078,2.6321 0.42395,4.3333 l 0.42395,3.0931 H 412.09062 410 Z m 0.66667,-2 c 0,-0.1834 -0.15,-0.3334 -0.33334,-0.3334 -0.18333,0 -0.33333,0.15 -0.33333,0.3334 0,0.1833 0.15,0.3333 0.33333,0.3333 0.18334,0 0.33334,-0.15 0.33334,-0.3333 z m -0.33334,-2.3334 c 0.22662,-0.3666 0.26203,-0.6666 0.0787,-0.6666 -0.18333,0 -0.51874,0.3 -0.74535,0.6666 -0.22662,0.3667 -0.26203,0.6667 -0.0787,0.6667 0.18333,0 0.51874,-0.3 0.74535,-0.6667 z m 89.80799,-49.55234 0.29675,-1.55237 -1.55237,0.29676 -1.55237,0.29675 v -0.82601 -0.82602 L 496.5,977.80171 c -0.45833,0.34739 -2.25141,0.67734 -3.98462,0.7332 l -3.15129,0.10157 -0.71898,-1.34342 c -0.79652,-1.48831 -0.32725,-3.715 1.13449,-5.38321 l 0.95522,-1.09014 8.60319,-0.0698 8.6032,-0.0698 0.57947,1.03545 0.57947,1.03546 0.86489,-1.04213 c 0.47569,-0.57317 1.89031,-1.04212 3.1436,-1.04212 h 2.27871 l -0.15628,2.64851 c -0.086,1.45668 0.0519,2.85668 0.30633,3.11111 0.44873,0.44873 0.73833,-2.22506 0.49746,-4.59296 l -0.11867,-1.16666 h 3.2419 c 1.78305,0 3.56805,0.32614 3.96666,0.72475 l 0.72476,0.72476 0.44792,-0.72476 c 0.5528,-0.89445 3.47974,-0.95798 4.01791,-0.0872 0.60672,0.98169 2.20048,0.0894 2.10387,-1.17788 L 530.33333,969 l 2.5,-0.20691 2.5,-0.20691 v 2.14357 2.14357 l 1.27438,-1.1533 1.27438,-1.15329 1.82505,0.21663 c 3.02724,0.35934 3.77201,3.28754 1.66317,6.53903 l -0.64148,0.98906 -6.36442,0.089 -6.36441,0.0891 v -0.65974 -0.65974 l -0.83333,0.6789 c -0.45834,0.3734 -2.40834,0.67551 -4.33334,0.67138 l -3.5,-0.008 -0.0267,-1.75641 -0.0267,-1.75641 -0.9488,1.74592 -0.9488,1.74592 -4.43593,0.0275 -4.43593,0.0275 -0.34011,-1.30057 -0.3401,-1.30057 -0.95294,1.36051 c -0.52412,0.74829 -1.56402,1.36052 -2.31089,1.36052 h -1.35794 L 502.85983,980 l -0.34867,1.33333 h -1.3333 -1.3333 z",
    transform: "translate(-200.43466,12.625805)"
};

const viewConfigs = [
    {
        title: "4 câmaras",
        sourceX: 455,
        sourceWidth: 104,
        targetDx: -292,
        labels: [
            {id:"path24", segment:17},
            {id:"path19", segment:14},
            {id:"path18", segment:9},
            {id:"path17", segment:3},
            {id:"path20", segment:16},
            {id:"path21", segment:12},
            {id:"path22", segment:6}
        ]
    },
    {
        title: "2 câmaras",
        sourceX: 175,
        sourceWidth: 108,
        targetDx: 146,
        labels: [
            {id:"path4", segment:17},
            {id:"path5", segment:13},
            {id:"path6", segment:7},
            {id:"path7", segment:1},
            {id:"path8", segment:15},
            {id:"path9", segment:10},
            {id:"path10", segment:4}
        ]
    },
    {
        title: "3 câmaras",
        sourceX: 308,
        sourceWidth: 112,
        targetDx: 146,
        labels: [
            {id:"path23", segment:17},
            {id:"path13", segment:14},
            {id:"path12", segment:8},
            {id:"path11", segment:2},
            {id:"path14", segment:16},
            {id:"path15", segment:11},
            {id:"path16", segment:5}
        ]
    }
];

const ventricularSegments = Object.fromEntries(
    viewConfigs.flatMap((view) => view.labels.map(({id, segment}) => [id, segment]))
);

let stressMode = false;
let usar17Segmentos = true;
const panelStore = new Map();
const svgNS = "http://www.w3.org/2000/svg";
const stateMenu = document.getElementById("stateMenu");

function segmentEnabled(segIndex){
    return usar17Segmentos || segIndex !== 16;
}

function getPanelData(id){
    return panelStore.get(id);
}

function createPanelData(id){
    const data = {
        id,
        state: new Array(17).fill(0),
        shapes: Array.from({length: 17}, () => []),
        selectedBox: null,
        laudoBox: null
    };
    panelStore.set(id, data);
    return data;
}

function createSvgElement(tag, attrs = {}){
    const el = document.createElementNS(svgNS, tag);
    Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
    return el;
}

function bindSegmentClick(el, panelId, segIndex){
    el.addEventListener("click", (event) => {
        event.stopPropagation();
        if(!segmentEnabled(segIndex)) return;
        openStateMenu(panelId, segIndex, event.clientX, event.clientY);
    });
}

function addShapeTarget(panelId, segIndex, el){
    getPanelData(panelId).shapes[segIndex].push(el);
    bindSegmentClick(el, panelId, segIndex);
}

function createNumberLabel(svg, x, y, segmentNumber, panelId, segIndex){
    const radius = Number(svg.dataset.labelSize || 9);
    const group = createSvgElement("g", {
        class: "label-chip",
        transform: `translate(${x} ${y})`
    });
    const circle = createSvgElement("circle", {r: radius});
    const text = createSvgElement("text", {x: 0, y: 1});
    text.textContent = segmentNumber;
    bindSegmentClick(group, panelId, segIndex);
    group.appendChild(circle);
    group.appendChild(text);
    svg.appendChild(group);
}

function syncSegmentVisual(panelId, segIndex){
    const data = getPanelData(panelId);
    const enabled = segmentEnabled(segIndex);
    const color = enabled ? states[data.state[segIndex]].c : "#e5e7eb";

    data.shapes[segIndex].forEach((shape) => {
        shape.setAttribute("fill", color);
        shape.classList.toggle("disabled", !enabled);
    });
}

function setSegmentState(panelId, segIndex, stateIndex){
    const data = getPanelData(panelId);
    data.state[segIndex] = stateIndex;
    syncSegmentVisual(panelId, segIndex);
    updateSelectionList(panelId);
    gerarLaudo(panelId);
}

function updateSelectionList(panelId){
    const data = getPanelData(panelId);
    const list = data.selectedBox;
    if(!list) return;

    const items = [];
    const total = usar17Segmentos ? 17 : 16;

    for(let i = 0; i < total; i++){
        if(data.state[i] === 0) continue;
        const seg = segmentos[i];
        const state = states[data.state[i]];
        items.push(`Segmento ${i + 1}: ${seg.parede} ${seg.nivel} - ${state.n}`);
    }

    if(!items.length){
        list.innerHTML = `<p class="empty">Nenhum segmento alterado.</p>`;
        return;
    }

    list.innerHTML = `<ul class="selection-list">${items.map((item) => `<li>${item}</li>`).join("")}</ul>`;
}

function buildLegend(){
    return states.map((state) => `
        <div class="legend-item">
            <span class="legend-swatch" style="background:${state.c}"></span>
            <span>${state.n}</span>
        </div>
    `).join("");
}

function addViewsCaptions(svg){
    [
        {x: 230, y: 95, text: "4 câmaras"},
        {x: 377, y: 95, text: "2 câmaras"},
        {x: 523, y: 95, text: "3 câmaras"}
    ].forEach(({x, y, text}) => {
        const label = createSvgElement("text", {
            x,
            y,
            class: "views-title",
            "text-anchor": "middle"
        });
        label.textContent = text;
        svg.appendChild(label);
    });
}

function buildVentricularViews(container, panelId){
    const svg = createSvgElement("svg", {
        viewBox: "145 82 430 190",
        class: "ventricular-svg"
    });
    const defs = createSvgElement("defs");
    viewConfigs.forEach((view, index) => {
        const clipPath = createSvgElement("clipPath", {
            id: `${panelId}_clip_top_${index}`,
            clipPathUnits: "userSpaceOnUse"
        });
        clipPath.appendChild(createSvgElement("rect", {
            x: view.sourceX,
            y: 88,
            width: view.sourceWidth,
            height: 180
        }));
        defs.appendChild(clipPath);
    });
    svg.appendChild(defs);

    viewConfigs.forEach((view, index) => {
        const guide = createSvgElement("path", {
            d: ventricularGuidePath.d,
            transform: `${ventricularGuidePath.transform} translate(${view.targetDx} 0)`,
            "clip-path": `url(#${panelId}_clip_top_${index})`,
            class: "guide-path"
        });
        svg.appendChild(guide);

        view.labels.forEach(({id, segment}) => {
            const sourcePath = ventricularPaths.find((item) => item.id === id);
            const path = createSvgElement("path", {
                d: sourcePath.d,
                id: `${panelId}_${id}`,
                class: "segment",
                fill: states[0].c,
                transform: `translate(${view.targetDx} 0)`
            });
            addShapeTarget(panelId, segment - 1, path);
            svg.appendChild(path);
        });
    });

    addViewsCaptions(svg);
    container.appendChild(svg);

    viewConfigs.forEach((view) => {
        view.labels.forEach(({id, segment}) => {
            const segIndex = segment - 1;
            const sourcePath = ventricularPaths.find((item) => item.id === id);
            const temp = createSvgElement("path", {d: sourcePath.d});
            svg.appendChild(temp);
            const box = temp.getBBox();
            svg.removeChild(temp);
            const radius = Math.max(6.5, Math.min(9, Math.min(box.width, box.height) * 0.28));
            svg.dataset.labelSize = radius.toFixed(2);
            createNumberLabel(
                svg,
                box.x + box.width / 2 + view.targetDx,
                box.y + box.height / 2,
                segment,
                panelId,
                segIndex
            );
        });
    });

    for(let i = 0; i < 17; i++) syncSegmentVisual(panelId, i);
}

function gerarLaudo(id){
    const data = getPanelData(id);
    const total = usar17Segmentos ? 17 : 16;
    const grupos = {hipocinesia: [], acinesia: [], discinesia: [], aneurismático: []};
    let soma = 0;

    for(let i = 0; i < total; i++){
        const state = states[data.state[i]];
        soma += state.score;
        if(state.n === "normal") continue;
        grupos[state.n].push(i + 1);
    }

    const linhas = [];
    if(grupos.hipocinesia.length) linhas.push(`Hipocinesia nos segmentos ${grupos.hipocinesia.join(", ")}.`);
    if(grupos.acinesia.length) linhas.push(`Acinesia nos segmentos ${grupos.acinesia.join(", ")}.`);
    if(grupos.discinesia.length) linhas.push(`Discinesia nos segmentos ${grupos.discinesia.join(", ")}.`);
    if(grupos["aneurismático"].length) linhas.push(`Aneurismático nos segmentos ${grupos["aneurismático"].join(", ")}.`);
    linhas.push(`WMSI parcial = ${(soma / total).toFixed(2)}.`);

    data.laudoBox.innerHTML = `<div class="laudo">${linhas.join("<br>")}</div>`;
}

function criarPainel(titulo, id){
    const data = createPanelData(id);
    const panel = document.createElement("div");
    panel.className = "panel";
    panel.id = id;
    panel.innerHTML = `
        <div class="card map-card">
            <div class="map-title-row">
                <h2>${stressMode ? titulo : "Mapa clicável"}</h2>
            </div>
            <p class="map-subtitle">Clique em um segmento para escolher o grau de contratilidade.</p>
            <div class="diagram-wrap">
                <div class="views-wrap"></div>
            </div>
        </div>
        <div class="sidebar">
            <div class="card sidebar-card">
                <h3>Legenda</h3>
                ${buildLegend()}
            </div>
            <div class="card sidebar-card">
                <h3>Segmentos Selecionados</h3>
                <div id="sel_${id}"><p class="empty">Nenhum segmento alterado.</p></div>
            </div>
            <div class="card sidebar-card">
                <h3>Laudo</h3>
                <div id="out_${id}"></div>
            </div>
            <div class="card sidebar-card">
                <h3>Ações</h3>
                <div class="actions">
                    <button onclick="resetarPainel('${id}')">Resetar</button>
                    <button onclick="copiarTexto('${id}')">Copiar laudo</button>
                </div>
            </div>
        </div>
    `;

    document.getElementById("container").appendChild(panel);
    data.selectedBox = panel.querySelector(`#sel_${id}`);
    data.laudoBox = panel.querySelector(`#out_${id}`);
    buildVentricularViews(panel.querySelector(".views-wrap"), id);
    updateSelectionList(id);
    gerarLaudo(id);
}

function openStateMenu(panelId, segIndex, x, y){
    const currentState = getPanelData(panelId).state[segIndex];
    stateMenu.innerHTML = `
        <p class="state-menu-title">Segmento ${segIndex + 1}</p>
        ${states.map((state, index) => `
            <button class="state-option ${index === currentState ? "active" : ""}" data-panel="${panelId}" data-segment="${segIndex}" data-state="${index}">
                <span class="state-swatch" style="background:${state.c}"></span>
                <span>${state.n}</span>
            </button>
        `).join("")}
    `;
    stateMenu.classList.remove("hidden");
    stateMenu.style.left = `${Math.max(14, Math.min(x, window.innerWidth - 240))}px`;
    stateMenu.style.top = `${Math.max(14, Math.min(y, window.innerHeight - 320))}px`;
}

function closeStateMenu(){
    stateMenu.classList.add("hidden");
}

stateMenu.addEventListener("click", (event) => {
    const button = event.target.closest(".state-option");
    if(!button) return;
    setSegmentState(button.dataset.panel, Number(button.dataset.segment), Number(button.dataset.state));
    closeStateMenu();
});

document.addEventListener("click", (event) => {
    if(!stateMenu.contains(event.target)) closeStateMenu();
});

function copiarTexto(id){
    navigator.clipboard.writeText(getPanelData(id).laudoBox.innerText);
}

function resetarPainel(id){
    const data = getPanelData(id);
    data.state.fill(0);
    for(let i = 0; i < 17; i++) syncSegmentVisual(id, i);
    updateSelectionList(id);
    gerarLaudo(id);
}

function resetar(){
    panelStore.forEach((_, id) => resetarPainel(id));
}

function atualizarBotaoModelo(){
    document.getElementById("btnModelo").innerText = usar17Segmentos ? "Usar modelo 16 segmentos" : "Usar modelo 17 segmentos";
}

function renderPaineis(){
    panelStore.clear();
    document.getElementById("container").innerHTML = "";
    if(stressMode){
        criarPainel("Repouso", "rep");
        criarPainel("Pico de Estresse", "est");
    }else{
        criarPainel("Repouso", "single");
    }
    atualizarBotaoModelo();
}

function toggleModo(){
    stressMode = !stressMode;
    renderPaineis();
}

function toggleModeloSegmentos(){
    usar17Segmentos = !usar17Segmentos;
    renderPaineis();
}

renderPaineis();
</script>
