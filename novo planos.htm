body {

}

}

    justify-content: center;
    align-items: center;

.container {

    gap: 30px;
    flex-wrap: wrap;

}

.panel {
    text-align: center;
    background: #fff;
    border-radius: 18px;
    padding: 20px 20px 18px;

    margin: 0 0 14px;
    font-size: 20px;
}

.panel-visuals {
    display: grid;
    gap: 18px;
}

.diagram-block {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 14px;
}

.diagram-caption {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #475569;
}

.bullseye-wrap {
    display: flex;
    justify-content: center;
}

.bullseye-svg {
    width: 330px;
    height: 330px;
}

.ventricular-svg {
    width: 100%;
    max-width: 720px;
    height: auto;
}

.segment {
    stroke: #334155;
    stroke-width: 1.8;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease, opacity 0.15s ease;
}

.segment:hover {
    filter: brightness(1.04);
}

.segment.disabled {
    cursor: not-allowed;
    opacity: 0.55;
}

.ventricular-segment {
    stroke-width: 2.2;
}

.segment-number {
    font-size: 11px;
    font-weight: 700;
    fill: #0f172a;
    pointer-events: none;
}

.bullseye-number {
    pointer-events: none;
}

.label-chip {
    cursor: pointer;
}

.label-chip circle {
    fill: rgba(255, 255, 255, 0.88);
    stroke: #64748b;
    stroke-width: 1;
}

.label-chip text {
    font-size: 10px;
    font-weight: 700;
    fill: #0f172a;
    dominant-baseline: middle;
    text-anchor: middle;
    pointer-events: none;
}

.views-title {
    font-size: 13px;
    font-weight: 700;
    fill: #334155;
}

.output {
    font-weight: 700;
    max-width: 500px;
    margin: 14px auto 10px;
    white-space: pre-line;
}

button {
    margin: 0;
    padding: 10px 16px;
    border: 1px solid #d0d7e2;
    border-radius: 999px;
    background: #fff;
    color: #1f2937;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
}

button:hover {
    background: #eef2f7;
    border-color: #b8c2d1;
    transform: translateY(-1px);
}

.state-menu {
    position: fixed;
    z-index: 1000;
    min-width: 220px;
    padding: 10px;
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 14px;
    box-shadow: 0 18px 44px rgba(15, 23, 42, 0.18);
}

.state-menu.hidden {
    display: none;
}

.state-menu-title {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 700;
    color: #334155;
}

.state-option {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: flex-start;
    border-radius: 10px;
    padding: 9px 10px;
    border: 1px solid transparent;
    background: transparent;
    transform: none;
}

.state-option:hover {
    background: #f8fafc;
    border-color: #e2e8f0;
    transform: none;
}

.state-option.active {
    background: #eff6ff;
    border-color: #bfdbfe;
}

.state-swatch {
    width: 14px;
    height: 14px;
    border-radius: 999px;
    border: 1px solid rgba(15, 23, 42, 0.2);
    flex: 0 0 auto;
}

@media (max-width: 720px) {
    .panel {
        padding: 16px 14px;
    }

    .bullseye-svg {
        width: 290px;
        height: 290px;
    }
}
</style>
</head>

const stateMenu = document.getElementById("stateMenu");

function segmentEnabled(segIndex){
    return usar17Segmentos || segIndex !== 16;
}

function getPanelData(id){
    return panelStore.get(id);
}

function createPanelData(id){
    const data = {
        id,
        state: new Array(17).fill(0),
        shapes: Array.from({length: 17}, () => []),
        viewsSvg: null
    };

    panelStore.set(id, data);
    return data;
}

function createSvgElement(tag, attrs = {}){
    const el = document.createElementNS(svgNS, tag);

    Object.entries(attrs).forEach(([key, value]) => {
        el.setAttribute(key, value);
    });

    return el;
}

function bindSegmentClick(el, panelId, segIndex){
    el.addEventListener("click", (event) => {
        event.stopPropagation();

        if(!segmentEnabled(segIndex)) return;

        openStateMenu(panelId, segIndex, event.clientX, event.clientY);
    });
}

function addShapeTarget(panelId, segIndex, el){
    const data = getPanelData(panelId);
    data.shapes[segIndex].push(el);
    bindSegmentClick(el, panelId, segIndex);
}

function createNumberLabel(svg, x, y, segmentNumber, panelId, segIndex){
    const sizeHint = Number(svg.dataset.labelSize || 9);
    const group = createSvgElement("g", {
        class: "label-chip",
        transform: `translate(${x} ${y})`
    });

    bindSegmentClick(group, panelId, segIndex);

    const circle = createSvgElement("circle", {r: sizeHint});
    const text = createSvgElement("text", {x: 0, y: 1});
    text.textContent = segmentNumber;

    group.appendChild(circle);
    group.appendChild(text);
    svg.appendChild(group);
}

function syncSegmentVisual(panelId, segIndex){
    const data = getPanelData(panelId);
    const stateIndex = data.state[segIndex];
    const enabled = segmentEnabled(segIndex);
    const fill = enabled ? states[stateIndex].c : "#e5e7eb";

    data.shapes[segIndex].forEach((el) => {
        el.setAttribute("fill", fill);
        el.classList.toggle("disabled", !enabled);
    });
}

function setSegmentState(panelId, segIndex, stateIndex){
    const data = getPanelData(panelId);

    data.state[segIndex] = stateIndex;
    syncSegmentVisual(panelId, segIndex);
    gerarLaudo(panelId);
}

function buildBullseye(svg, panelId){
    const data = getPanelData(panelId);
    svg.classList.add("bullseye-svg");

    function polar(r, a){
        return {x: 200 + r * Math.cos(a), y: 200 + r * Math.sin(a)};
    }

    function arc(r1, r2, a1, a2){
        const p1 = polar(r1, a1);
        const p2 = polar(r2, a1);
        const p3 = polar(r2, a2);
        const p4 = polar(r1, a2);
        const large = (a2 - a1) > Math.PI ? 1 : 0;

        return `M${p1.x} ${p1.y} L${p2.x} ${p2.y}
A${r2} ${r2} 0 ${large} 1 ${p3.x} ${p3.y}
L${p4.x} ${p4.y}
A${r1} ${r1} 0 ${large} 0 ${p1.x} ${p1.y}Z`;
    }

    function ring(r1, r2, count, start){
        const step = 2 * Math.PI / count;

        for(let i = 0; i < count; i++){
            const a1 = i * step - Math.PI / 2 - step / 2;
            const a2 = a1 + step;
            const idx = start + ((i === 0) ? 0 : count - i);
            const path = createSvgElement("path", {
                d: arc(r1, r2, a1, a2),
                class: "segment",
                fill: states[0].c
            });

            addShapeTarget(panelId, idx, path);
            svg.appendChild(path);

            const m = (a1 + a2) / 2;
            const r = (r1 + r2) / 2;
            const p = polar(r, m);
            const t = createSvgElement("text", {
                x: p.x,
                y: p.y,
                "text-anchor": "middle",
                class: "segment-number bullseye-number"
            });

            t.textContent = idx + 1;
            svg.appendChild(t);
        }
    }

    ring(120, 180, 6, 0);
    ring(60, 120, 6, 6);
    ring(20, 60, 4, 12);

    if(usar17Segmentos){
        const apex = createSvgElement("circle", {
            cx: 200,
            cy: 200,
            r: 20,
            class: "segment",
            fill: states[0].c
        });

        addShapeTarget(panelId, 16, apex);
        svg.appendChild(apex);

        const label = createSvgElement("text", {
            x: 200,
            y: 200,
            "text-anchor": "middle",
            class: "segment-number bullseye-number"
        });

        label.textContent = "17";
        svg.appendChild(label);
    }

    data.bullseyeSvg = svg;
}

function addViewsCaptions(svg){
    const captions = [
        {x: 230, y: 95, text: "4 câmaras"},
        {x: 377, y: 95, text: "2 câmaras"},
        {x: 523, y: 95, text: "3 câmaras"},
        {x: 224, y: 308, text: "Basal"},
        {x: 386, y: 308, text: "Médio"},
        {x: 520, y: 316, text: "Apical"}
    ];

    captions.forEach(({x, y, text}) => {
        const label = createSvgElement("text", {
            x,
            y,
            class: "views-title",
            "text-anchor": "middle"
        });

        label.textContent = text;
        svg.appendChild(label);
    });
}

function buildVentricularViews(container, panelId){
    const svg = createSvgElement("svg", {
        viewBox: "145 86 430 340",
        class: "ventricular-svg"
    });
    const defs = createSvgElement("defs");
    const clipPath = createSvgElement("clipPath", {
        id: `${panelId}_clipPath4`,
        clipPathUnits: "userSpaceOnUse"
    });
    const clipRect = createSvgElement("rect", {
        x: 310.20453,
        y: 68.212509,
        width: 477.48755,
        height: 344.31076,
        style: "fill:none"
    });
    clipPath.appendChild(clipRect);
    defs.appendChild(clipPath);
    svg.appendChild(defs);

    const guidePath = createSvgElement("path", {
        d: ventricularGuidePath.d,
        transform: ventricularGuidePath.transform,
        "clip-path": `url(#${panelId}_clipPath4)`,
        fill: "#0f172a",
        opacity: "0.85",
        "pointer-events": "none"
    });
    svg.appendChild(guidePath);

    ventricularPaths.forEach(({id, d}) => {
        const segmentNumber = ventricularSegments[id];
        const segIndex = segmentNumber - 1;
        const path = createSvgElement("path", {
            d,
            id: `${panelId}_${id}`,
            class: "segment ventricular-segment",
            fill: states[0].c
        });

        if(segmentNumber){
            addShapeTarget(panelId, segIndex, path);
        }

        svg.appendChild(path);
    });

    container.appendChild(svg);
    addViewsCaptions(svg);

    ventricularPaths.forEach(({id}) => {
        const segmentNumber = ventricularSegments[id];
        if(!segmentNumber) return;

        const segIndex = segmentNumber - 1;
        const path = svg.querySelector(`#${CSS.escape(panelId + "_" + id)}`);
        const box = path.getBBox();
        const cx = box.x + box.width / 2;
        const cy = box.y + box.height / 2;
        const radius = Math.max(6.8, Math.min(9.2, Math.min(box.width, box.height) * 0.28));
        svg.dataset.labelSize = radius.toFixed(2);
        createNumberLabel(svg, cx, cy, segmentNumber, panelId, segIndex);
    });

    getPanelData(panelId).viewsSvg = svg;

    for(let i = 0; i < 17; i++){
        syncSegmentVisual(panelId, i);
    }
}

function criarPainel(titulo, id){
    createPanelData(id);

    const div = document.createElement("div");
    div.className = "panel";
    div.id = id;
    div.innerHTML = `
        <h4>${titulo}</h4>
        <div id="cap_${id}" class="panel-visuals">
            <div class="diagram-block">
                <p class="diagram-caption">Bull's Eye</p>
                <div class="bullseye-wrap">
                    <svg class="bullseye-svg" viewBox="0 0 400 400"></svg>
                </div>
            </div>
            <div class="diagram-block">
                <p class="diagram-caption">Vistas ventriculares</p>
                <div class="views-wrap"></div>
            </div>
        </div>
        <p class="output" id="out_${id}"></p>
        <button onclick="copiarTexto('${id}')">Copiar texto</button>
    `;

    document.getElementById("container").appendChild(div);
    buildBullseye(div.querySelector(".bullseye-svg"), id);
    buildVentricularViews(div.querySelector(".views-wrap"), id);
}

function openStateMenu(panelId, segIndex, x, y){
    const currentState = getPanelData(panelId).state[segIndex];
    const title = `<p class="state-menu-title">Segmento ${segIndex + 1}</p>`;
    const buttons = states.map((state, index) => `
        <button class="state-option ${index === currentState ? "active" : ""}" data-panel="${panelId}" data-segment="${segIndex}" data-state="${index}">
            <span class="state-swatch" style="background:${state.c}"></span>
            <span>${state.n}</span>
        </button>
    `).join("");

    stateMenu.innerHTML = title + buttons;
    stateMenu.classList.remove("hidden");

    const menuWidth = 220;
    const menuHeight = 280;
    const left = Math.min(x, window.innerWidth - menuWidth - 14);
    const top = Math.min(y, window.innerHeight - menuHeight - 14);

    stateMenu.style.left = `${Math.max(14, left)}px`;
    stateMenu.style.top = `${Math.max(14, top)}px`;
}

function closeStateMenu(){
    stateMenu.classList.add("hidden");
}

stateMenu.addEventListener("click", (event) => {
    const button = event.target.closest(".state-option");
    if(!button) return;

    const panelId = button.dataset.panel;
    const segIndex = Number(button.dataset.segment);
    const stateIndex = Number(button.dataset.state);

    setSegmentState(panelId, segIndex, stateIndex);
    closeStateMenu();
});

document.addEventListener("click", (event) => {
    if(!stateMenu.contains(event.target)){
        closeStateMenu();
    }
});

function gerarLaudo(id){
    const state = getPanelData(id).state;
    const totalSegmentos = usar17Segmentos ? 17 : 16;
    const grupos = {hipocinesia:{},acinesia:{},discinesia:{},aneurismático:{}};
    let soma = 0;

    for(let i = 0; i < totalSegmentos; i++){
        const s = states[state[i]];
        soma += s.score;

        if(s.n === "normal") continue;

        const seg = segmentos[i];

        if(!grupos[s.n][seg.parede]) grupos[s.n][seg.parede] = [];
        grupos[s.n][seg.parede].push(seg.nivel);
    }

    const wmsi = (soma / totalSegmentos).toFixed(2);

    function fmt(grupo){
        const txt = [];

        for(const parede in grupo){
            const niveis = [...new Set(grupo[parede])];

            if(parede === "apical"){
                txt.push("segmento apical");
                continue;
            }

            txt.push(`parede ${parede} (${niveis.join(" e ")})`);
        }

        return txt.join(", ");
    }

    let out = "";

    if(Object.keys(grupos.hipocinesia).length) out += "Hipocinesia em " + fmt(grupos.hipocinesia) + ".\n";
    if(Object.keys(grupos.acinesia).length) out += "Acinesia em " + fmt(grupos.acinesia) + ".\n";
    if(Object.keys(grupos.discinesia).length) out += "Discinesia em " + fmt(grupos.discinesia) + ".\n";
    if(Object.keys(grupos["aneurismático"]).length) out += "Aneurismático em " + fmt(grupos["aneurismático"]) + ".\n";
    if(wmsi === "1.00") out += "Contratilidade segmentar normal.\n";
    out += "WMSI = " + wmsi + ".";

    document.getElementById("out_" + id).innerText = out;
}

function copiarTexto(id){
    navigator.clipboard.writeText(document.getElementById("out_" + id).innerText);
    alert("Texto copiado");
}

function resetar(){
    panelStore.forEach((data, id) => {
        data.state.fill(0);

        for(let i = 0; i < 17; i++){
            syncSegmentVisual(id, i);
        }

        gerarLaudo(id);
    });
}

function copiarParaClipboard(incluirTextos){
    const captura = document.createElement("div");
    captura.style.display = "flex";
    captura.style.justifyContent = "center";
    captura.style.gap = "30px";
    captura.style.flexWrap = "wrap";
    captura.style.background = "#fff";
    captura.style.padding = "10px";

    document.querySelectorAll(".panel").forEach((panel) => {
        const bloco = document.createElement("div");
        bloco.className = "panel";

        const titulo = panel.querySelector("h4");
        const cap = panel.querySelector("[id^='cap_']");

        if(titulo) bloco.appendChild(titulo.cloneNode(true));
        if(cap) bloco.appendChild(cap.cloneNode(true));

        if(incluirTextos){
            const out = panel.querySelector(".output");
            if(out) bloco.appendChild(out.cloneNode(true));
        }

        if(bloco.children.length) captura.appendChild(bloco);
    });

    captura.style.position = "fixed";
    captura.style.left = "-99999px";
    document.body.appendChild(captura);

    html2canvas(captura, {backgroundColor:"#ffffff"}).then((canvas) => {
        canvas.toBlob((blob) => {
            navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
            alert(incluirTextos ? "Diagramas com textos copiados" : "Diagramas copiados");
            document.body.removeChild(captura);
        });
    });
}

function copiarAmbos(){
    copiarParaClipboard(false);
}

function copiarComTextos(){
    copiarParaClipboard(true);
}

function atualizarBotaoModelo(){
    const botao = document.getElementById("btnModelo");
    if(botao) botao.innerText = usar17Segmentos ? "Usar modelo 16 segmentos" : "Usar modelo 17 segmentos";
}

function renderPaines(){
    closeStateMenu();
    panelStore.clear();

    const c = document.getElementById("container");
    c.innerHTML = "";

    if(stressMode){
        criarPainel("Repouso", "rep");
        criarPainel("Pico de Estresse", "est");
    }else{
        criarPainel("Repouso", "single");
    }

    atualizarBotaoModelo();

    panelStore.forEach((_, id) => {
        for(let i = 0; i < 17; i++){
            syncSegmentVisual(id, i);
        }

        gerarLaudo(id);
    });
}

function toggleModo(){
    stressMode = !stressMode;
    renderPaines();
}

function toggleModeloSegmentos(){
    usar17Segmentos = !usar17Segmentos;
    renderPaines();
}

renderPaines();
</script>
